name: Build APK

on:
  push:
    branches:
      - 'android/hamitv'
  pull_request:
    branches:
      - 'android/hamitv'
  workflow_dispatch:

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already ships the Android SDK; locating cmdline-tools
      # manually avoids android-actions/setup-android, which still tries to
      # install the removed "tools" package on newer cmdline-tools.
      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          CMDLINE_TOOLS="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin 2>/dev/null | tail -n 1)"
          if [ -z "$CMDLINE_TOOLS" ]; then
            echo "cmdline-tools not found under $SDK_ROOT" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$CMDLINE_TOOLS" >> "$GITHUB_PATH"

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore stable debug keystore
        run: |
          # Without a fixed key every run signs with a fresh ephemeral key and
          # successive builds cannot be installed over each other.
          mkdir -p "$HOME/.android"
          if [ -n "${{ secrets.HAMITV_DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.HAMITV_DEBUG_KEYSTORE_BASE64 }}" | base64 -d > "$HOME/.android/debug.keystore"
            echo "restored $(stat -c%s "$HOME/.android/debug.keystore") bytes"
          else
            echo "HAMITV_DEBUG_KEYSTORE_BASE64 missing; signature will change every run"
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Collect APK
        run: |
          mkdir -p build-output
          find app/build/outputs/apk/debug -name '*.apk' -exec cp -v {} build-output/hamitv-debug.apk \;
          ls -l build-output

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hamitv-debug
          path: build-output/hamitv-debug.apk
          if-no-files-found: error
          retention-days: 30
