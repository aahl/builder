name: Build APK

on:
  push:
    branches:
      - 'android/wallpanel'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Assemble debug + release APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;30.0.3"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore fixed release keystore
        run: |
          # A stable signing key is required so successive CI builds can be
          # installed over each other (a fresh key per run causes
          # INSTALL_FAILED_UPDATE_INCOMPATIBLE). The keystore is stored as a
          # base64 secret; when it is absent the build still falls back to an
          # ephemeral debug key (installable, but not upgrade-compatible).
          mkdir -p "$HOME/.android"
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$HOME/.android/wp-release.jks"
            echo "keystore restored: $(ls -l "$HOME/.android/wp-release.jks" | awk '{print $5}') bytes"
          else
            echo "KEYSTORE_BASE64 not set; will fall back to an ephemeral debug keystore"
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Write keystore.properties
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            cat > keystore.properties <<EOF
          storeFile=$HOME/.android/wp-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=wallpanel
          keyPassword=${{ secrets.KEYSTORE_PASSWORD }}
          EOF
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APKs
        run: ./gradlew --no-daemon assembleDevDebug assembleProdRelease

      - name: Collect debug APK
        run: |
          mkdir -p build-output/debug
          find . -path '*/build/outputs/apk/dev/debug/*.apk' -exec cp -v {} build-output/debug/ \;

      - name: Collect release APK (arm64-v8a)
        run: |
          mkdir -p build-output/release
          find . -path '*/build/outputs/apk/prod/release/*arm64-v8a*release*.apk' -exec cp -v {} build-output/release/ \;

      - name: Collect universal APK
        run: |
          mkdir -p build-output/universal
          find . -path '*/build/outputs/apk/prod/release/*universal*release*.apk' -exec cp -v {} build-output/universal/ \;

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wallpanel-debug
          path: build-output/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: wallpanel-release-arm64-v8a
          path: build-output/release/*.apk
          if-no-files-found: error

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: wallpanel-universal
          path: build-output/universal/*.apk
          if-no-files-found: error
