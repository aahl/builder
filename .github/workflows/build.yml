name: Build APK

on:
  push:
    branches:
      - 'android/wallpanel'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Assemble debug + release APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;30.0.3"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APKs
        run: ./gradlew --no-daemon assembleDevDebug assembleProdRelease

      - name: Collect debug APK
        run: |
          mkdir -p build-output/debug
          find . -path '*/build/outputs/apk/dev/debug/*.apk' -exec cp -v {} build-output/debug/ \;

      - name: Collect release APK (arm64-v8a)
        run: |
          mkdir -p build-output/release
          find . -path '*/build/outputs/apk/prod/release/*arm64-v8a*release*.apk' -exec cp -v {} build-output/release/ \;

      - name: Collect universal APK
        run: |
          mkdir -p build-output/universal
          find . -path '*/build/outputs/apk/prod/release/*universal*release*.apk' -exec cp -v {} build-output/universal/ \;

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wallpanel-debug
          path: build-output/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK (arm64-v8a)
        uses: actions/upload-artifact@v4
        with:
          name: wallpanel-release-arm64-v8a
          path: build-output/release/*.apk
          if-no-files-found: error

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: wallpanel-universal
          path: build-output/universal/*.apk
          if-no-files-found: error
