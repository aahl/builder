name: Test and ARMv7 build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            client/go.sum
            third_party/ninego/*/go.sum
      - name: Source, privacy, and unit checks
        run: make test
      - name: Build speaker-side commands
        run: make build
      - name: Upload ARMv7 binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lx04-armv7
          path: |
            dist/lx04-agent
            dist/lx04-bootstrap
            dist/lx04-netcheck
            dist/lx04-searchcheck
            dist/lx04-websetup
            dist/SHA256SUMS
          if-no-files-found: error
