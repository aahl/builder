<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HA MiTV</title>
<style>
  :root {
    --bg: #0e1216;
    --panel: #161c22;
    --line: #232c34;
    --text: #e6edf3;
    --muted: #8b9aa7;
    --accent: #4c9aff;
    --danger: #f0616d;
    --ok: #3fb950;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
    padding: 20px 16px 48px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: .02em; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .card h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin: 0 0 12px; font-weight: 600;
  }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input, textarea, select {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: #0b0f13; color: var(--text);
    font: inherit; outline: none;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; min-height: 240px; resize: vertical; }
  button {
    border: 0; border-radius: 8px; padding: 10px 16px; font: inherit;
    font-weight: 600; cursor: pointer; background: var(--accent); color: #fff;
  }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .kv { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .kv:last-child { border-bottom: 0; }
  .kv span:first-child { color: var(--muted); }
  .code {
    font-size: 44px; letter-spacing: .3em; text-align: center;
    font-family: ui-monospace, Menlo, monospace; margin: 10px 0 4px;
  }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: #1f2933; border: 1px solid var(--line); color: var(--text);
    padding: 10px 16px; border-radius: 10px; font-size: 14px;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }
  .toast.err { border-color: var(--danger); color: #ffd7da; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">

  <div id="login" class="hidden">
    <h1>HA MiTV</h1>
    <div class="sub">输入电视屏幕上显示的 4 位配对码</div>
    <div class="card">
      <input id="code" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="0000" autofocus
             style="text-align:center;font-size:32px;letter-spacing:.4em;font-family:ui-monospace,Menlo,monospace">
      <div class="row"><button id="pair">连接</button></div>
    </div>
  </div>

  <div id="app" class="hidden">
    <h1>HA MiTV</h1>
    <div class="sub" id="subtitle">—</div>

    <div class="card">
      <h2>状态</h2>
      <div id="status"></div>
    </div>

    <div class="card">
      <h2>摄像头画中画</h2>
      <div class="sub" id="pipStatus" style="margin:0 0 10px">读取中…</div>
      <label for="pipCamera">摄像头</label>
      <select id="pipCamera"></select>
      <div class="row">
        <button id="pipStart">打开画中画</button>
        <button id="pipClose" class="ghost">关闭</button>
        <button id="pipRefresh" class="ghost">刷新</button>
      </div>
    </div>

    <div class="card">
      <h2>设备</h2>
      <label for="name">名称</label>
      <input id="name" maxlength="32">
      <div class="grid">
        <div><label for="webPort">配置台端口</label><input id="webPort" inputmode="numeric"></div>
        <div><label for="espPort">ESPHome 端口</label><input id="espPort" inputmode="numeric"></div>
      </div>
      <div class="row"><button id="save">保存</button></div>
    </div>

    <div class="card">
      <h2>加密</h2>
      <div class="sub" id="noiseStatus" style="margin:0 0 10px">读取中…</div>
      <label style="display:flex;align-items:center;gap:10px;margin:0 0 4px;color:var(--text)">
        <input type="checkbox" id="noiseEnabled" style="width:auto;margin:0">
        <span>启用 Noise 加密（PSK）</span>
      </label>
      <label for="psk">预共享密钥（base64，32 字节）</label>
      <input id="psk" spellcheck="false" autocomplete="off"
             style="font-family:ui-monospace,Menlo,monospace;font-size:13px">
      <div class="row">
        <button id="noiseSave">保存</button>
        <button id="pskCopy" class="ghost">复制</button>
        <button id="pskRotate" class="ghost">刷新密钥</button>
      </div>
    </div>

    <div class="card">
      <h2>命令表</h2>
      <textarea id="commands" spellcheck="false"></textarea>
      <div class="row">
        <button id="saveCommands">保存命令表</button>
        <button id="reloadCommands" class="ghost">重新读取</button>
      </div>
    </div>

    <div class="card">
      <h2>维护</h2>
      <label style="display:flex;align-items:center;gap:10px;margin:0 0 4px;color:var(--text)">
        <input type="checkbox" id="adbKeep" style="width:auto;margin:0">
        <span>开机后自动保持 ADB 调试</span>
      </label>
      <div class="sub" id="adbHint" style="margin:0 0 10px"></div>
      <div class="row">
        <button class="ghost" onclick="location.href='/wallpapers'">壁纸管理</button>
        <button class="ghost" onclick="location.href='/study'">学习管控</button>
        <button id="rotate" class="ghost">重置配对码</button>
        <button id="restart" class="ghost">重启服务</button>
      </div>
    </div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);

function toast(message, isError) {
  const el = $("toast");
  el.textContent = message;
  el.className = "toast show" + (isError ? " err" : "");
  clearTimeout(el._timer);
  el._timer = setTimeout(() => { el.className = "toast"; }, 2600);
}

async function api(path, options = {}) {
  const response = await fetch(path, {
    credentials: "same-origin",
    headers: { "X-Requested-With": "hamitv", "Content-Type": "application/json" },
    ...options,
  });
  if (response.status === 401) {
    showLogin();
    throw new Error("unauthorized");
  }
  if (!response.ok) {
    let detail = response.statusText;
    try { detail = (await response.json()).error || detail; } catch (_) {}
    throw new Error(detail);
  }
  const type = response.headers.get("content-type") || "";
  return type.includes("json") ? response.json() : response.text();
}

function showLogin() {
  $("login").classList.remove("hidden");
  $("app").classList.add("hidden");
  // The page exists to be paired once: put the caret in the box so a phone or
  // a remote keyboard can type the four digits straight away.
  $("code").focus();
}

function showApp() {
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
}

async function loadStatus() {
  const status = await api("/api/status");
  $("subtitle").textContent = `${status.name} · ${status.ip}:${status.webPort}`;
  $("status").innerHTML = [
    ["型号", status.model],
    ["Android", status.android],
    ["ESPHome 端口", status.espPort],
    ["ESPHome 状态", status.espRunning
      ? `运行中 · ${status.espConnections} 个连接 · ${status.espEntities} 个按钮`
      : "未启动"],
    ["自动发现", status.mdnsRegistered ? "已广播（HA 可自动发现）" : "未广播"],
    ["配对码", status.pairingCode],
    ["运行时长", Math.floor(status.uptimeSeconds / 60) + " 分钟"],
  ].map(([k, v]) => `<div class="kv"><span>${k}</span><span>${v}</span></div>`).join("");
}

async function loadConfig() {
  const config = await api("/api/config");
  $("name").value = config.deviceName;
  $("webPort").value = config.webPort;
  $("espPort").value = config.espPort;
}

async function loadNoise() {
  const noise = await api("/api/noise");
  $("noiseEnabled").checked = noise.enabled;
  $("psk").value = noise.psk;
  renderNoise(noise);
}

function renderNoise(noise) {
  $("noiseStatus").textContent = noise.enabled
    ? `已启用 · ${noise.connections} 个连接 · 改密钥后需同步更新 HA 里的密钥`
    : "已关闭，API 走明文（仅适合可信内网）";
}

function renderAdb(state) {
  $("adbKeep").checked = state.keep;
  const now = state.enabled ? "当前 ADB：开" : "当前 ADB：关";
  const hint = state.granted
    ? "已授权：开机后被关掉会自动打开；电视使用中手动关闭则不再恢复。"
    : "没有 WRITE_SECURE_SETTINGS，打开也不会生效。先执行：adb shell pm grant com.ts.launcher android.permission.WRITE_SECURE_SETTINGS";
  $("adbHint").textContent = `${now} · ${hint}`;
}

async function loadAdb() {
  renderAdb(await api("/api/adb"));
}

$("adbKeep").onchange = async () => {
  try {
    const state = await api("/api/adb", {
      method: "PUT",
      body: JSON.stringify({ keep: $("adbKeep").checked }),
    });
    renderAdb(state);
    toast(state.keep ? (state.granted ? "已开启" : "已记录，但没有权限不会生效") : "已关闭");
    // The keeper writes adb_enabled on its own thread; read the result again once it has run.
    if (state.keep && !state.enabled) setTimeout(loadAdb, 1500);
  } catch (error) {
    toast(error.message, true);
  }
};

async function saveNoise(enabled) {
  const noise = await api("/api/noise", {
    method: "PUT",
    body: JSON.stringify({ enabled, psk: $("psk").value.trim() }),
  });
  $("noiseEnabled").checked = noise.enabled;
  $("psk").value = noise.psk;
  renderNoise(noise);
  return noise;
}

async function loadCommands() {
  const data = await api("/api/commands");
  // The endpoint answers application/json, so fetch parses it into objects.
  $("commands").value = typeof data === "string" ? data : JSON.stringify(data, null, 2);
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function renderPip(info) {
  const select = $("pipCamera");
  const previous = select.value;
  if (info.available) {
    select.innerHTML = info.cameras.length
      ? info.cameras.map((c) => `<option value="${escapeHtml(c.did)}">${escapeHtml(c.roomName || c.did)}</option>`).join("")
      : `<option value="">未发现摄像头</option>`;
    if (previous) select.value = previous;
    $("pipStatus").textContent =
      `已连接 · API ${info.apiLevel} · ${info.cameras.length} 个摄像头 · 画中画${info.floating ? "已打开" : "未打开"}` +
      (info.error ? ` · 上次操作失败：${info.error}` : "");
  } else {
    select.innerHTML = `<option value="">不可用</option>`;
    $("pipStatus").textContent = "不可用：" + (info.error || "无法连接小米摄像头服务");
  }
}

async function loadPip() {
  renderPip(await api("/api/pip"));
}

async function boot() {
  try {
    await loadStatus();
    await Promise.all([loadConfig(), loadCommands(), loadPip(), loadNoise(), loadAdb()]);
    showApp();
  } catch (error) {
    if (error.message !== "unauthorized") {
      toast(error.message, true);
      showLogin();
    }
  }
}

$("pair").onclick = async () => {
  const code = $("code").value.trim();
  if (!/^\d{4}$/.test(code)) return toast("请输入 4 位数字", true);
  $("pair").disabled = true;
  try {
    await api("/api/pair", { method: "POST", body: JSON.stringify({ code }) });
    $("code").value = "";
    await boot();
  } catch (error) {
    toast(error.message, true);
  } finally {
    $("pair").disabled = false;
  }
};

$("code").addEventListener("keydown", (event) => {
  if (event.key === "Enter") $("pair").click();
});

$("save").onclick = async () => {
  try {
    const result = await api("/api/config", {
      method: "PUT",
      body: JSON.stringify({
        deviceName: $("name").value.trim(),
        webPort: Number($("webPort").value),
        espPort: Number($("espPort").value),
      }),
    });
    toast(result.restartRequired ? "已保存，端口变更需重启服务" : "已保存");
    if (result.restartRequired) await loadStatus();
  } catch (error) {
    toast(error.message, true);
  }
};

$("saveCommands").onclick = async () => {
  try {
    await api("/api/commands", { method: "PUT", body: $("commands").value });
    toast("命令表已保存");
  } catch (error) {
    toast("保存失败：" + error.message, true);
  }
};

$("reloadCommands").onclick = async () => {
  try {
    await loadCommands();
    toast("已重新读取");
  } catch (error) {
    toast(error.message, true);
  }
};

$("pipStart").onclick = async () => {
  const did = $("pipCamera").value;
  if (!did) return toast("没有可用的摄像头", true);
  try {
    renderPip(await api("/api/pip/start", { method: "POST", body: JSON.stringify({ did }) }));
    toast("已发送打开指令");
  } catch (error) {
    toast(error.message, true);
  }
};

$("pipClose").onclick = async () => {
  try {
    renderPip(await api("/api/pip/close", { method: "POST" }));
    toast("已关闭画中画");
  } catch (error) {
    toast(error.message, true);
  }
};

$("pipRefresh").onclick = async () => {
  try {
    await loadPip();
    toast("已刷新");
  } catch (error) {
    toast(error.message, true);
  }
};

$("noiseSave").onclick = async () => {
  const enabled = $("noiseEnabled").checked;
  if (enabled && !confirm("启用后 HA 必须填入下面的密钥才能连接，确定吗？")) {
    $("noiseEnabled").checked = false;
    return;
  }
  try {
    await saveNoise(enabled);
    toast(enabled ? "已启用，请把密钥填入 HA" : "已关闭加密");
    await loadStatus();
  } catch (error) {
    toast(error.message, true);
  }
};

$("pskCopy").onclick = async () => {
  const value = $("psk").value;
  try {
    await navigator.clipboard.writeText(value);
    toast("密钥已复制");
  } catch (_) {
    // Clipboard API needs a secure context; the console is plain http.
    $("psk").select();
    document.execCommand("copy");
    toast("密钥已复制");
  }
};

$("pskRotate").onclick = async () => {
  if (!confirm("刷新后旧密钥立即失效，HA 需要重新填新密钥，确定吗？")) return;
  try {
    const noise = await api("/api/noise/rotate", { method: "POST" });
    $("psk").value = noise.psk;
    renderNoise(noise);
    toast("已生成新密钥");
  } catch (error) {
    toast(error.message, true);
  }
};

$("rotate").onclick = async () => {
  try {
    const result = await api("/api/code/rotate", { method: "POST" });
    toast("新配对码：" + result.code);
    showLogin();
  } catch (error) {
    toast(error.message, true);
  }
};

$("restart").onclick = async () => {
  try {
    await api("/api/restart", { method: "POST" });
    toast("服务重启中，稍后刷新页面");
  } catch (error) {
    toast(error.message, true);
  }
};

boot();
</script>
</body>
</html>
