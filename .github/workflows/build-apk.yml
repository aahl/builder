name: Build Android TV APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "要构建的版本号（如 1.2.7-a1）。留空则使用 package.json 中的版本。"
        required: false
        default: ""
  push:
    branches:
      - android/oriontv

jobs:
  direct_build:
    name: Build Android TV APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Resolve version
        id: version
        run: |
          INPUT_VERSION="${{ github.event.inputs.version }}"
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Setup JDK
        uses: actions/setup-java@v3
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Prebuild TV App
        run: yarn prebuild-tv

      - name: Build TV APK
        run: yarn build-local

      - name: Prepare APK artifact
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk "artifacts/orionTV.${{ steps.version.outputs.value }}.apk"
          ls -l artifacts

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: orionTV-${{ steps.version.outputs.value }}
          path: artifacts/orionTV.${{ steps.version.outputs.value }}.apk
          if-no-files-found: error
          retention-days: 30
