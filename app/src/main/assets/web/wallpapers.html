<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>壁纸管理 · HA MiTV</title>
<style>
  :root {
    --bg: #0e1216;
    --panel: #161c22;
    --line: #232c34;
    --text: #e6edf3;
    --muted: #8b9aa7;
    --accent: #4c9aff;
    --danger: #f0616d;
    --ok: #3fb950;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
    padding: 20px 16px 48px;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: .02em; }
  a { color: var(--accent); text-decoration: none; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .card h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin: 0 0 12px; font-weight: 600;
  }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  label.check { display: flex; align-items: center; gap: 10px; color: var(--text); margin: 0 0 10px; }
  label.check input { width: auto; margin: 0; }
  input, select {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: #0b0f13; color: var(--text);
    font: inherit; outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); }
  input[type=file] { padding: 8px; }
  input[type=number] { max-width: 180px; }
  button {
    border: 0; border-radius: 8px; padding: 10px 16px; font: inherit;
    font-weight: 600; cursor: pointer; background: var(--accent); color: #fff;
  }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .wallgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .wall { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #0b0f13; }
  .wall img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; background: #000; }
  .wall .meta { padding: 8px 10px 0; font-size: 12px; }
  .wall .name { word-break: break-all; }
  .wall .size { color: var(--muted); margin-top: 2px; }
  .wall .warn { color: var(--danger); margin-top: 2px; }
  .wall button {
    margin: 8px 10px 10px; padding: 6px 10px; font-size: 12px;
    background: transparent; border: 1px solid var(--line); color: var(--danger);
  }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: #1f2933; border: 1px solid var(--line); color: var(--text);
    padding: 10px 16px; border-radius: 10px; font-size: 14px;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }
  .toast.err { border-color: var(--danger); color: #ffd7da; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">

  <div id="login" class="hidden">
    <h1>壁纸管理</h1>
    <div class="card">
      <div class="sub" style="margin:0 0 10px">需要先在 <a href="/">控制台</a> 输入电视上的 4 位配对码。</div>
      <a href="/"><button class="ghost">去配对</button></a>
    </div>
  </div>

  <div id="app" class="hidden">
    <h1>壁纸管理</h1>
    <div class="sub"><a href="/">← 返回控制台</a> · 改动会写入电视的壁纸目录，回到桌面后生效</div>

    <div class="card">
      <h2>轮换</h2>
      <label class="check">
        <input type="checkbox" id="enabled">
        <span>在桌面显示壁纸</span>
      </label>
      <div class="grid">
        <div>
          <label for="minutes">切换间隔（分钟，0 = 不轮换）</label>
          <input id="minutes" type="number" min="0" max="1440" step="1" inputmode="numeric">
        </div>
        <div>
          <label for="order">顺序</label>
          <select id="order">
            <option value="shuffle">随机</option>
            <option value="sequential">按文件名</option>
          </select>
        </div>
      </div>
      <label for="dim">暗化（0–90%）</label>
      <input id="dim" type="number" min="0" max="90" step="1" inputmode="numeric">
      <div class="row">
        <button id="save">保存设置</button>
      </div>
      <div class="sub" id="settingsHint" style="margin:12px 0 0"></div>
    </div>

    <div class="card">
      <h2>上传</h2>
      <input type="file" id="files" multiple accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp">
      <div class="row">
        <button id="upload">上传</button>
        <span class="sub" id="uploadStatus" style="margin:0"></span>
      </div>
      <div class="sub" style="margin:10px 0 0">单张 ≤10MB，最多 100 张；文件名会清理成英文、数字和短横线。</div>
    </div>

    <div class="card">
      <h2>已上传 <span id="count"></span></h2>
      <div id="list" class="wallgrid"></div>
      <div class="sub" id="empty" style="margin:0">还没有壁纸</div>
    </div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let state = null;

function toast(message, isError) {
  const el = $("toast");
  el.textContent = message;
  el.className = "toast show" + (isError ? " err" : "");
  clearTimeout(el._timer);
  el._timer = setTimeout(() => { el.className = "toast"; }, 3200);
}

async function api(path, options = {}) {
  const response = await fetch(path, {
    credentials: "same-origin",
    headers: { "X-Requested-With": "hamitv", "Content-Type": "application/json" },
    ...options,
  });
  if (response.status === 401) {
    showLogin();
    throw new Error("unauthorized");
  }
  if (!response.ok) {
    let detail = response.statusText;
    try { detail = (await response.json()).error || detail; } catch (_) {}
    throw new Error(detail);
  }
  return response.status === 204 ? null : response.json();
}

function showLogin() {
  $("login").classList.remove("hidden");
  $("app").classList.add("hidden");
}

function showApp() {
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
}

function humanSize(bytes) {
  if (bytes >= 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + " MB";
  return Math.max(1, Math.round(bytes / 1024)) + " KB";
}

function render(next) {
  state = next;
  $("enabled").checked = next.enabled;
  $("minutes").value = next.rotationMinutes;
  $("order").value = next.order;
  $("dim").value = next.dim;
  $("count").textContent = `${next.files.length} / ${next.maxFiles}`;
  const hints = [];
  if (next.onTvChoice) {
    const picked = next.onTvChoice === "none" ? "无（关闭）" : next.onTvChoice;
    hints.push(`电视上选过「${picked}」，会覆盖这里的设置；到桌面设置里选「Theme default」可恢复。`);
  } else if (next.files.length && next.rotationMinutes === 0) {
    hints.push("间隔为 0，桌面不会轮换这个集合；把它改成大于 0 才会显示。");
  } else {
    hints.push("回到电视后，切换一次应用再回桌面，壁纸就会重新加载。");
  }
  $("settingsHint").textContent = hints.join(" ");

  const list = $("list");
  list.replaceChildren();
  $("empty").classList.toggle("hidden", next.files.length > 0);
  for (const file of next.files) {
    const card = document.createElement("div");
    card.className = "wall";

    const image = document.createElement("img");
    image.loading = "lazy";
    image.alt = file.name;
    image.src = "/api/wallpapers/" + encodeURIComponent(file.name) + "?v=" + file.size;
    card.appendChild(image);

    const meta = document.createElement("div");
    meta.className = "meta";
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = file.name;
    const size = document.createElement("div");
    size.className = "size";
    size.textContent = humanSize(file.size);
    meta.append(name, size);
    if (!file.usable) {
      const warn = document.createElement("div");
      warn.className = "warn";
      warn.textContent = "超过 10MB，桌面会忽略";
      meta.appendChild(warn);
    }
    card.appendChild(meta);

    const remove = document.createElement("button");
    remove.textContent = "删除";
    remove.onclick = () => removeWallpaper(file.name);
    card.appendChild(remove);

    list.appendChild(card);
  }
}

async function refresh() {
  render(await api("/api/wallpapers"));
}

async function removeWallpaper(name) {
  if (!confirm(`删除 ${name}？`)) return;
  try {
    await api("/api/wallpapers/" + encodeURIComponent(name), { method: "DELETE" });
    toast("已删除");
    await refresh();
  } catch (error) {
    toast(error.message, true);
  }
}

$("save").onclick = async () => {
  const button = $("save");
  button.disabled = true;
  try {
    const minutes = Number($("minutes").value || 0);
    const dim = Number($("dim").value || 0);
    const next = await api("/api/wallpapers", {
      method: "PUT",
      body: JSON.stringify({
        enabled: $("enabled").checked,
        rotationMinutes: Math.max(0, Math.min(1440, Math.round(minutes))),
        order: $("order").value,
        dim: Math.max(0, Math.min(90, Math.round(dim))),
      }),
    });
    render(next);
    toast("已保存，回到桌面后生效");
  } catch (error) {
    toast(error.message, true);
  } finally {
    button.disabled = false;
  }
};

$("upload").onclick = async () => {
  const input = $("files");
  if (!input.files.length) {
    toast("先选择图片", true);
    return;
  }
  const button = $("upload");
  const status = $("uploadStatus");
  button.disabled = true;
  status.textContent = `上传中…（${input.files.length} 张）`;
  try {
    const body = new FormData();
    for (const file of input.files) body.append("file", file, file.name);
    const response = await fetch("/api/wallpapers", {
      method: "POST",
      credentials: "same-origin",
      headers: { "X-Requested-With": "hamitv" },
      body,
    });
    if (response.status === 401) {
      status.textContent = "";
      showLogin();
      return;
    }
    if (!response.ok) {
      let detail = response.statusText;
      try { detail = (await response.json()).error || detail; } catch (_) {}
      throw new Error(detail);
    }
    const result = await response.json();
    const added = result.added.length;
    const failed = result.errors.length;
    status.textContent = added ? `已上传 ${added} 张` : "";
    toast(failed ? `上传 ${added} 张，${failed} 张失败` : `已上传 ${added} 张`, failed > 0);
    if (failed) {
      status.textContent = result.errors.join("；");
    }
    input.value = "";
    await refresh();
  } catch (error) {
    status.textContent = "";
    toast(error.message, true);
  } finally {
    button.disabled = false;
  }
};

(async function boot() {
  try {
    await refresh();
    showApp();
  } catch (error) {
    if (error.message !== "unauthorized") toast(error.message, true);
  }
})();
</script>
</body>
</html>
